<!DOCTYPE html>
<html lang="ppt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doce Patinhas</title>
    <link rel="stylesheet" href="./css/formulario.css">
</head>
<body>
<div class="container">
    <h1>Criar cadastro</h1>

    <div class="imagem">
        <img src="./imagem/perfil.jpg" alt="fundo">
    </div>

    <h6>Adicionar foto +</h6>

    <form>

        <h3>Dados do tutor</h3>
        <div class="form-control">
            <label for="nome">Nome completo:</label>
            <input type="text"  id="nome">
        </div>

        <div class="form-control">
            <label for="email">Email:</label>
            <input type="email"  id="email">
        </div>

        <div class="form-control">
            <label for="cpf">CPF:</label>
            <input type="text"  id="cpf">
        </div>

        <div class="form-control">
            <label for="telefone">Telefone:</label>
            <input type="tel"  id="telefone">
        </div>

         <div class="form-control">
            <label for="origem">Como nos conheceu?</label>
       <select id="origem">
        <option value="">Selecione</option>
        <option value="instagram">Instagram</option>
        <option value="google">Google</option>
        <option value="tik tok">Tik Tok</option>
        <option value="indicações">Indicações</option>
        <option value="ja sou cliente">Já sou cliente</option>
        <option value="outro">Outro</option>
       </select>
        </div>
    </form>

    <form>
         <h2>Dados do pet</h2>
        <div class="form-control">
            <label for="nome">Nome do animal:</label>
            <input type="text"  id="nome">
        </div>

        <div class="form-control">
            <label for="raca">Raça do animal:</label>
            <input type="raca"  id="raca">
        </div>

        <div class="form-control">
            <label for="idade">Idade:</label>
            <input type="idade"  id="idade">
        </div>

          <div class="form-control">
            <label for="sexo">Sexo:</label>
            <input type="sexo"  id="sexo">
        </div>

         <div class="form-control">
            <label for="porte">Porte do animal</label>
       <select id="porte">
        <option value="">Selecione</option>
        <option value="gigante">Gigante</option>
        <option value="grande">Grande</option>
        <option value="medio">Médio</option>
        <option value="pequeno">Pequeno</option>
       </select>
        </div>

          <div class="form-control">
            <label for="especie">Espécie</label>
       <select id="especie">
        <option value="">Selecione</option>
        <option value="cao">Cão</option>
        <option value="gato">Gato</option>
        <option value="exotico">Exótico</option>
        <option value="outro">Outro</option>
       </select>
        </div>
    </form>

    <form>
         <h2>Vacinas e alergias</h2>
        <div class="form-control">
            <label for="vacinas">Vacinas:</label>
            <input type="vacina"  id="vacina">
        </div>

        <div class="form-control">
            <label for="alergia">Alergias ou doenças:</label>
            <input type="alergia"  id="alergia">
        </div>

        <div class="form-control">
            <button type="submit" class="btn-cadastro">Cadastrar</button>
            <button type="reset" class="btn-limpar">Limpar</button>
        </div>

       
    </form>
</div>


    
</body>
</html>
